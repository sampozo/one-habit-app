<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>One Habit - Minimalism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Home Screen -->
        <section id="home-screen" class="screen active">
            <header>
                <h1>One Habit</h1>
            </header>
            
            <div id="no-habit" class="empty-state hidden">
                <div class="empty-icon">🌑</div>
                <h2>Sin hábito activo</h2>
                <p>El primer paso es el más importante.</p>
                <button class="btn-primary" onclick="app.showScreen('create-screen')">Empezar ahora</button>
            </div>

            <div id="active-habit-container" class="hidden">
                <div class="glass-card habit-card">
                    <div id="habit-emoji" class="habit-emoji">🌱</div>
                    <h2 id="habit-display-name">Cargando...</h2>
                    <div class="streak-badge">
                        <span id="streak-count" class="mono">0</span>
                        <span class="streak-label">DÍAS</span>
                    </div>
                </div>

                <div class="progress-container">
                    <div id="monthly-progress" class="circles-grid">
                        <!-- Progress circles will be injected here -->
                    </div>
                    <p class="progress-text">Progreso de este mes</p>
                </div>

                <button id="complete-btn" class="btn-complete" onclick="app.markDone()">
                    <span class="btn-icon">✅</span>
                    <span class="btn-text">Hecho por hoy</span>
                </button>
            </div>

            <nav class="bottom-nav">
                <button onclick="app.showScreen('stats-screen')">📊 Stats</button>
                <button class="fab" onclick="app.showScreen('create-screen')">+</button>
                <button onclick="app.showScreen('history-screen')">📜 Historial</button>
            </nav>
        </section>

        <!-- Create Screen -->
        <section id="create-screen" class="screen">
            <header>
                <button class="btn-back" onclick="app.showScreen('home-screen')">←</button>
                <h1>Nuevo Hábito</h1>
            </header>
            
            <form id="habit-form" onsubmit="app.saveHabit(event)">
                <div class="input-group">
                    <label>¿Qué quieres lograr?</label>
                    <input type="text" id="habit-name" placeholder="Ej. Meditar 10 min" required>
                </div>

                <div class="input-group">
                    <label>Icono / Emoji</label>
                    <input type="text" id="habit-icon" placeholder="✨" value="✨" maxlength="2">
                </div>

                <div class="input-group">
                    <label>Meta (días)</label>
                    <select id="habit-goal">
                        <option value="21">21 días (Hábito base)</option>
                        <option value="30">30 días (Consolidación)</option>
                        <option value="66" selected>66 días (Instalación)</option>
                        <option value="0">Sin límite</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Recordatorio</label>
                    <input type="time" id="habit-reminder" value="08:00">
                </div>

                <button type="submit" class="btn-primary">Establecer Hábito</button>
            </form>
        </section>

        <!-- Stats Screen -->
        <section id="stats-screen" class="screen">
            <header>
                <button class="btn-back" onclick="app.showScreen('home-screen')">←</button>
                <h1>Estadísticas</h1>
            </header>
            <div class="stats-grid">
                <div class="glass-card stat-item">
                    <span class="stat-value mono" id="total-days-month">0</span>
                    <span class="stat-label">Días este mes</span>
                </div>
                <div class="glass-card stat-item">
                    <span class="stat-value mono" id="best-streak">0</span>
                    <span class="stat-label">Mejor racha</span>
                </div>
            </div>
        </section>

        <!-- History Screen -->
        <section id="history-screen" class="screen">
            <header>
                <button class="btn-back" onclick="app.showScreen('home-screen')">←</button>
                <h1>Historial</h1>
            </header>
            <div id="history-list" class="history-list">
                <!-- History items injected here -->
            </div>
        </section>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
